version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        versions: ["6.x"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
